# gitjig: source-only
name: Directive proposal
description: Propose a Directive — a medium-term directional context that scopes several Execution Issues. Maintainer triages via `/triage`.
title: "directive: <one-line objective>"
labels: [directive, status:proposed]
body:
  - type: markdown
    attributes:
      value: |
        A Directive is a **directing context**, not a unit of work. It names what scope of work is worth doing over a few weeks and gives Execution Issues a coherent parent to live under. The maintainer reviews this proposal via `/triage` and either accepts (Status → Active) or rejects (refiled in a different template).

        Before filing, scan [`MISSION.md`](../blob/main/MISSION.md) and the [open Directives](https://github.com/ilgyu-yi/gitjig-pi/issues?q=is%3Aopen+label%3Adirective) to make sure this proposal doesn't duplicate existing direction.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One paragraph naming what this Directive is trying to achieve. Bound by a concrete artifact-level boundary (file paths, issue counts, AC ticks, merge events) — not "improve" or "optimize" without a target.
      placeholder: |
        Ship an end-to-end slice of <capability>, from doc to passing test. Concrete artifacts: <file paths>, the SSOT doc section that states the contract, the test section that verifies it.
    validations:
      required: true

  - type: textarea
    id: success-signals
    attributes:
      label: Success signals
      description: 2-5 verifiable conditions for completion. Each must be objectively testable by a reasonable engineer — name the artifact / metric / state that demonstrates the signal is met.
      placeholder: |
        - `<command>` run on <input> produces <observable artifact>.
        - <doc file> states the new contract with zero `(TBD)` placeholders.
        - Test suite passes with the new assertions added.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: At least 2 explicit exclusions. What this Directive does NOT cover. Sharper non-goals tighten scope clarity.
      placeholder: |
        - Does NOT add <adjacent capability> (sibling item, separate Directive).
        - Does NOT modify <existing surface this Directive must leave intact>.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: At least 1 invariant to preserve throughout the Directive's lifetime. Reviewer-gating, mode semantics, audit shape, etc.
      placeholder: |
        - Preserve <a review or gating contract that must survive this Directive>.
        - Preserve <a record shape or interface other tooling depends on>.
    validations:
      required: true

  - type: textarea
    id: mission-fit
    attributes:
      label: MISSION fit
      description: Which `MISSION.md` section or success criterion does this Directive serve? One sentence. (If MISSION.md doesn't yet exist or doesn't cover this, say so honestly — the Directive may motivate a MISSION amendment.)
      placeholder: |
        Serves MISSION § "Success looks like > <item>" — state which mission outcome this direction advances and why it needs a Directive-level commitment.
    validations:
      required: true

  - type: textarea
    id: confidence
    attributes:
      label: Confidence (0-100)
      description: Self-assessment of hypothesis quality at filing time. Lower numbers are OK — Directives can be filed under uncertainty as long as success signals are verifiable. Optional but encouraged.
      placeholder: "75"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional — links to prior discussions, related Issues, ADRs.
    validations:
      required: false
