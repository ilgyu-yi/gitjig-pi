name: Bug report
description: Report a defect — something doesn't work as documented by this project.
title: "fix: <subject>"
labels: [bug, status:proposed]
body:
  - type: textarea
    id: what
    attributes:
      label: What's broken
      description: One paragraph naming the defect.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproducer
      description: Steps to reproduce. Include command + expected vs actual output. If discovered during a session, include the timestamp and audit-log entry if relevant.
      placeholder: |
        1. Run `<command> 2>&1 | tail -5` under <conditions>.
        2. Expected: <the documented behavior>.
        3. Actual: <the observed output, with timestamp if relevant>.
    validations:
      required: true

  - type: textarea
    id: root-cause-or-hypothesis
    attributes:
      label: Root cause or hypothesis
      description: If known, name the file:line. Otherwise list candidate hypotheses for diagnosis to narrow.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions as `- [ ] <item>`. Include "reproducer no longer fires" + smoke regression check.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
