name: landing-label-hygiene

on:
  pull_request_target:
    types: [synchronize]
  push:
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: landing-label-hygiene-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  invalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Invalidate stale landing advisory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f .github/workflows/landing-label-hygiene.mjs ]]; then
            printf '%s\n' 'landing label hygiene refused: trusted adapter unavailable'
            exit 0
          fi
          node .github/workflows/landing-label-hygiene.mjs
