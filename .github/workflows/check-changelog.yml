# gitjig: source-only
name: check-changelog

# Per-PR fragment-gate for the release backbone.
# Blocks PRs to protected branches that lack a changelog fragment under
# `changelog_unreleased/<category>/<N>.md` matching the contract in
# changelog_unreleased/TEMPLATE.md, unless the PR carries the
# `skip-changelog` label.
#
# Sleeps clean while the pull request is a draft: the floor this gate enforces
# binds from the ready transition onward (SPEC §1.3, §2.3), so until then its
# subject does not exist (SPEC §5.3). The sleep is a deliberate branch, and
# `ready_for_review` is in the trigger set below so the gate wakes at the
# transition it defers to. The draft state is read CONJUNCTIVELY — the
# `pull_request` payload's `draft` AND the live `isDraft` from the `gh pr view`
# this job already makes — because a live read taken on `ready_for_review` can
# be eventually-consistent and return a stale `true`, which would sleep the
# gate on the very event meant to wake it. Either source reading false runs the
# gate, so a disagreement can only refuse the sleep, never grant it: ambiguity
# falls toward the block (SPEC §3.9). `converted_to_draft` is deliberately NOT
# in the trigger set — firing on it would turn a red at a head into a green
# without that head changing.
#
# Residual — what the sleep deliberately leaves unreached (SPEC §3.11), so each
# gap reads as a decision rather than an oversight:
#
#   1. Clause 2, check-changelog.sh's universal no-junk check over the
#      newly-landing fragments, sleeps with clause 1: the draft branch sits
#      above the call into the script, which owns both.
#   2. That script's three fail-closed arms — empty payload, truncation, an
#      unrecognized status — sleep with it, for the same reason.
#   3. `edited`, the event a base retarget produces, is not in the trigger set,
#      so a retarget alone does not re-evaluate the gate.
#   4. Either source of the draft read returning false runs the gate. The
#      conjunction is one-sided by design, so a draft whose payload or live
#      read says false is gated as though it were ready.
#   5. A pull request re-drafted after a red keeps that verdict until its next
#      push; the sleep is not retroactive.
#   6. A `labeled` or `unlabeled` event on a re-drafted pull request can report
#      green on an unchanged head. Enumerated here and left to its own change.
#
# Pure bash + gh. No third-party Actions;
# actions/checkout is the canonical GitHub-shipped equivalent of `git
# clone`.

on:
  pull_request:
    branches:
      - main
      - '*-maintenance'
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# One head can carry several `fragment-gate` runs, and the required-check
# rollup returns all of them undeduplicated — so a run queued while the pull
# request was still a draft can complete AFTER a ready-era run at the same
# head. Which of the two the platform honours is not measured here. A cancelled
# run is never a success, so cancelling the earlier run of the group is correct
# under every candidate rule rather than under a guess about one. The group is
# keyed on the pull request number: runs of one pull request contend, runs of
# different pull requests do not.
concurrency:
  group: check-changelog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4

      - name: skip-changelog label short-circuit
        id: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUM" --repo "$REPO" --json labels --jq '[.labels[].name]')
          if printf '%s' "$labels" | jq -e 'index("skip-changelog") != null' >/dev/null 2>&1; then
            echo "skip-changelog label applied — bypassing fragment-gate"
            echo "bypass=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate fragments against the net PR file listing
        if: steps.label.outputs.bypass != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # The runs API exposes the webhook NAME and never the activity type,
          # so `ready_for_review` and `synchronize` are indistinguishable from
          # outside the run. Echo it so the run log carries what fired this
          # evaluation. Routed through `env:` like every other event value in
          # this file, even though the platform controls the enum.
          echo "check-changelog: pull_request activity type = ${EVENT_ACTION}"

          if [ ! -f .github/workflows/check-changelog.sh ]; then
            echo "::error::.github/workflows/check-changelog.sh is missing — restore it from this repository's history (the substrate onboarding commit ships it)." >&2
            exit 1
          fi

          # Two independent fetches now feed the gate, so a flaky external
          # call is retried with a short backoff and then fails closed with a
          # message that is explicitly not a missing-fragment failure.
          #
          # SPEC §3.10: a delegated call is admitted on OUTPUT VALIDITY alone,
          # never on the process's exit status — a run that exits 0 with junk
          # output, or with none, is a failure the caller has to see. Each
          # call site therefore names a validity predicate, and an attempt
          # whose output fails it is retried like any other failure.
          # Both predicates share two clauses. `-s` slurps the response into an
          # array of documents, so `length == 1` is what rejects a CONCATENATED
          # pair — `jq -e 'type == "object"'` over a two-document stream exits
          # 0, and the second document's `.number` then widens the allow-set.
          # The type clause rejects a zero-exit body of the wrong shape. Each
          # predicate's own comment states what else it does or does not check.
          nonempty_object() {
            [ -n "$1" ] || return 1
            printf '%s' "$1" \
              | jq -e -s 'length == 1 and (.[0] | type == "object") and (.[0] | length > 0)' \
                >/dev/null 2>&1
          }

          # The listing is the paginated shape `--slurp` produces: ONE document
          # holding an array of pages, so a multi-page response is expected and
          # admitted; what this rejects is a second document. Emptiness is
          # deliberately NOT tested here. `[[]]` is what the
          # platform returns for a collection with no members, so a pull request
          # whose net diff is empty produces it legitimately — refusing it at the
          # fetch spends three retries and then names re-running, which cannot
          # clear it. The script decides emptiness instead: it cross-checks the
          # entry count against the PR's own changedFiles, and its floor refusal
          # names the recovery that is live for an empty listing.
          single_document_array() {
            [ -n "$1" ] || return 1
            printf '%s' "$1" \
              | jq -e -s 'length == 1 and (.[0] | type == "array")' \
                >/dev/null 2>&1
          }

          fetch_with_retry() {
            local what=$1
            local is_valid=$2
            shift 2
            local attempt=1
            local out=''
            while [ "$attempt" -le 3 ]; do
              if out=$("$@") && "$is_valid" "$out"; then
                printf '%s' "$out"
                return 0
              fi
              echo "check-changelog: attempt ${attempt} to fetch ${what} produced no usable output; retrying." >&2
              sleep "$((attempt * 2))"
              attempt=$((attempt + 1))
            done
            echo "::error::Failed to fetch ${what} after 3 attempts — the gate could not read the PR. This is NOT a missing-fragment failure; re-run the job." >&2
            return 1
          }

          # One call supplies both the allow-set (PR number ∪
          # closingIssuesReferences — the fragment stem may be either, see
          # changelog_unreleased/TEMPLATE.md) and the expected file count.
          pr_json=$(fetch_with_retry "the PR metadata" nonempty_object \
            gh pr view "$PR_NUM" --repo "$REPO" \
            --json number,closingIssuesReferences,changedFiles,isDraft)

          # The live draft read rides the fetch above rather than a second
          # call. An absent or malformed field yields the string `null` here,
          # which is not `true`, so a degraded read runs the gate.
          live_draft=$(printf '%s' "$pr_json" | jq -r '.isDraft')

          # The sleep is CONJUNCTIVE and compared by exact string equality: the
          # payload's `draft` AND the live `isDraft` must both read `true`. The
          # payload therefore only ever VETOES the sleep, never grants it, so
          # an eventually-consistent live `true` on `ready_for_review` cannot
          # silence the gate on the very event meant to wake it.
          if [ "$PR_DRAFT" = "true" ] && [ "$live_draft" = "true" ]; then
            echo "::warning::fragment-gate slept: this pull request is a draft (payload draft=true and live isDraft=true), so the changelog fragment floor was not evaluated. Run 'gh pr ready ${PR_NUM}' to mark it ready and wake the gate."
            {
              echo "### fragment-gate slept — draft pull request"
              echo
              echo "The webhook payload's \`draft\` and the live \`isDraft\` both read \`true\`, so the changelog fragment floor was **not evaluated** on this run."
              echo
              echo "Recovery: \`gh pr ready ${PR_NUM}\` marks the pull request ready for review, which wakes the gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The NET file listing: merge-base..head, one entry per file with
          # its final status — not the per-commit patch union, which reports a
          # file touched and then reverted, and reports a path that is no
          # longer in the checkout. `--slurp` is rejected together with `--jq`
          # by gh, so the shaping happens in a separate jq below.
          files_json=$(fetch_with_retry "the PR file listing" single_document_array \
            gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUM}/files?per_page=100")

          allowed=$(printf '%s' "$pr_json" \
            | jq -r '[.number, (.closingIssuesReferences[]?.number)] | unique | map(tostring) | join(" ")')
          expected=$(printf '%s' "$pr_json" | jq -r '.changedFiles')

          printf '%s' "$files_json" | bash .github/workflows/check-changelog.sh \
            --pr "$PR_NUM" \
            --expected-count "$expected" \
            --allowed "$allowed" \
            --root .
