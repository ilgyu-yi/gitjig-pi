name: ac-closeout

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  evaluate:
    name: ac-closeout-evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch adapter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate acceptance closeout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/workflows/ac-closeout-event.mjs
